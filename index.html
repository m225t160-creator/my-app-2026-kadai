<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Memo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <i data-lucide="book-open" class="app-logo"></i>
                <h1>Classroom Memo</h1>
            </div>
            <div class="header-right">
                <div class="search-container">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="search-input" placeholder="メモを検索...">
                </div>
                <button id="new-memo-btn" class="btn btn-primary">
                    <i data-lucide="plus"></i>
                    <span>新規メモ</span>
                </button>
            </div>
        </header>

        <main class="app-main">
            <div id="memo-list" class="memo-list">
                <!-- Memos will be injected here -->
            </div>
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon-container">
                    <i data-lucide="sparkles" class="empty-icon"></i>
                </div>
                <h3>まだメモがないよ</h3>
                <p>「新規メモ」ボタンから、はじめてのメモを書いてみよう！ ✨</p>
            </div>
        </main>

        <!-- Editor Modal -->
        <div id="editor-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <input type="text" id="memo-title-input" placeholder="タイトルをかいてね..." class="title-input">
                    <div class="modal-actions">
                        <button id="close-modal-btn" class="btn btn-ghost">やめる</button>
                        <button id="save-memo-btn" class="btn btn-primary">ほぞんする</button>
                    </div>
                </div>
                
                <div class="modal-meta">
                    <div class="meta-section">
                        <span>きぶん：</span>
                        <div class="mood-picker" id="mood-picker">
                            <button class="mood-btn selected" data-mood="😊" title="はっぴー">😊</button>
                            <button class="mood-btn" data-mood="📝" title="しゅうちゅう">📝</button>
                            <button class="mood-btn" data-mood="😐" title="ふつう">😐</button>
                            <button class="mood-btn" data-mood="💤" title="ねむい">💤</button>
                            <button class="mood-btn" data-mood="😰" title="おつかれ">😰</button>
                        </div>
                    </div>
                    <div class="meta-section">
                        <span>たぐ：</span>
                        <div class="tag-picker" id="tag-picker">
                            <button class="tag-btn selected" data-color="default" style="background: #e2e8f0;"></button>
                            <button class="tag-btn" data-color="pink" style="background: #ffcad4;"></button>
                            <button class="tag-btn" data-color="mint" style="background: #b9fbc0;"></button>
                            <button class="tag-btn" data-color="sky" style="background: #9bf6ff;"></button>
                            <button class="tag-btn" data-color="lavender" style="background: #e0c3fc;"></button>
                        </div>
                    </div>
                </div>

                <div class="modal-body">
                    <div class="editor-pane">
                        <div class="pane-header">編集 (Markdown)</div>
                        <textarea id="memo-content-input" placeholder="ここに入力..."></textarea>
                    </div>
                    <div class="preview-pane">
                        <div class="pane-header">プレビュー</div>
                        <div id="markdown-preview" class="markdown-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
